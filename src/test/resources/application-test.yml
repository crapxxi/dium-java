# Профиль для тестов: встроенный PostgreSQL (адрес подставляет AbstractIntegrationTest),
# схема создаётся Flyway-миграциями, как в проде; WhatsApp замокан, лимит запросов выключен
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    password:
  jpa:
    show-sql: false
  flyway:
    locations: classpath:db/migration

whatsapp:
  api:
    url: http://localhost:9
    instance:
      id: test-instance
      token: test-token

two-factor:
  required-for-staff: true

rate-limit:
  enabled: false
