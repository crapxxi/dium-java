spring:
  config:
    # Локальный .env (см. .env.example). Переменные окружения ОС имеют приоритет.
    import: "optional:file:.env[.properties]"
  profiles:
    active: dev
  application:
    name: dium-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jpa:
    hibernate:
      # Схемой управляет только Flyway; Hibernate лишь сверяет сущности с БД
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Не "усыновлять" непустую схему без истории миграций — падаем явно
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    placeholders:
      "[admin_phone]": ${DIUM_ADMIN_PHONE:}
      "[admin_name]": ${DIUM_ADMIN_NAME:}
      "[admin_password_hash]": ${DIUM_ADMIN_PASSWORD_HASH:}
  cache:
    type: jcache
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider

jwt:
  # Base64. Дефолт только для dev/test — в prod-профиле JWT_KEY обязателен (application-prod.yml).
  secret: ${JWT_KEY:ZGl1bS1kZXYtb25seS1qd3Qtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMDAx}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:temp}
  api_key: ${CLOUDINARY_API_KEY:12345}
  api_secret: ${CLOUDINARY_API_SECRET:secret}

whatsapp:
  api:
    # Только хост Green API, без пути (см. apiUrl в личном кабинете)
    url: ${WHATSAPP_API_URL:https://api.green-api.com}
    instance:
      # Без этих значений приложение стартует, но отправка сообщений вернёт понятную ошибку
      id: ${WHATSAPP_INSTANCE_ID:}
      token: ${WHATSAPP_API_TOKEN:}

otp:
  length: 6
  ttl: 5m
  max-attempts: 5
  resend-cooldown: 60s

bucket4j:
  enabled: true
  filters:
    - cache-name: buckets
      url: /api/.*
      strategy: first
      http-response-body: "{ \"status\": 429, \"error\": \"Too Many Requests\", \"message\": \"Лимит запросов исчерпан. Попробуйте позже.\" }"
      rate-limits:
        - execute-condition: "getHttpServletRequest().getRequestURI().contains('/api/auth')"
          cache-key: "getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For').split(',')[0] : getRemoteAddr()"
          bandwidths:
            - capacity: 5
              time: 1
              unit: minutes

        - execute-condition: "getHttpServletRequest().getRequestURI().contains('/api/whatsapp')"
          cache-key: "getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For').split(',')[0] : getRemoteAddr()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: hours

        - cache-key: "getHeader('X-Forwarded-For') != null ? getHeader('X-Forwarded-For').split(',')[0] : getRemoteAddr()"
          bandwidths:
            - capacity: 100
              time: 1
              unit: minutes


server:
  port: ${PORT:8080}