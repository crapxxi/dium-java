spring:
  config:
    # Локальный .env (см. .env.example). Переменные окружения ОС имеют приоритет.
    import: "optional:file:.env[.properties]"
  profiles:
    active: dev
  application:
    name: dium-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    hikari:
      # Все таблицы приложения живут в отдельной схеме "dium".
      # В "public" остаются старые таблицы, созданные Hibernate до Flyway
      # (их данные переносит миграция V5).
      schema: dium
  jpa:
    hibernate:
      # Схемой управляет только Flyway; Hibernate лишь сверяет сущности с БД
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: dium
  flyway:
    enabled: true
    schemas: dium
    default-schema: dium
    create-schemas: true
    locations: classpath:db/migration
    # Не "усыновлять" непустую схему без истории миграций — падаем явно
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
    placeholders:
      "[admin_phone]": ${DIUM_ADMIN_PHONE:}
      "[admin_name]": ${DIUM_ADMIN_NAME:}
      "[admin_password_hash]": ${DIUM_ADMIN_PASSWORD_HASH:}
  cache:
    type: jcache
    jcache:
      provider: com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      # Короткие таймауты: при зависшем Redis запрос не ждёт, а быстро уходит на Caffeine
      connect-timeout: 500ms
      timeout: 500ms

jwt:
  # Base64. Дефолт только для dev/test — в prod-профиле JWT_KEY обязателен (application-prod.yml).
  secret: ${JWT_KEY:ZGl1bS1kZXYtb25seS1qd3Qtc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0wMDAx}

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME:temp}
  api_key: ${CLOUDINARY_API_KEY:12345}
  api_secret: ${CLOUDINARY_API_SECRET:secret}

whatsapp:
  api:
    # Только хост Green API, без пути (см. apiUrl в личном кабинете)
    url: ${WHATSAPP_API_URL:https://api.green-api.com}
    instance:
      # Без этих значений приложение стартует, но отправка сообщений вернёт понятную ошибку
      id: ${WHATSAPP_INSTANCE_ID:}
      token: ${WHATSAPP_API_TOKEN:}

# Тексты уведомлений в WhatsApp. Плейсхолдеры: {orderId}, {paymentFrom}, {totalSum}, {comment}.
notifications:
  # Владельцу заведения — о новом заказе
  new-order: "Новый заказ #{orderId}\nОплата от:{paymentFrom}, Сумма оплаты:{totalSum}\nКомментарии:{comment}"
  # Клиенту — при переходе заказа в статус. Статус без шаблона уведомления не вызывает.
  order-status:
    PREPARING: "Ваш заказ #{orderId} готовится!"
    COMPLETED: "Ваш заказ #{orderId} готов!"
    CANCELLED: "Ваш заказ #{orderId} отменен"

# Доставка заказов студентами-курьерами
delivery:
  # Цена доставки за заказ целиком, ₸: столько платит клиент и столько же получает курьер.
  # Не зависит ни от количества товаров, ни от заведения
  fee: ${DELIVERY_FEE:100}
  # Длина кодов передачи: код курьера (вводит заведение) и код клиента (вводит курьер)
  code-length: 4
  # Неверных вводов кода до блокировки; при блокировке создаётся проблема для администратора
  max-code-attempts: 5
  # Сколько незавершённых доставок может вести один курьер
  max-active-per-courier: 2
  # Сроки этапов (проверка раз в минуту):
  timeouts:
    # Никто не взял заказ — доставка отменяется, клиент забирает сам
    searching: ${DELIVERY_TIMEOUT_SEARCHING:30m}
    # Заказ готов, а курьер за ним не пришёл — курьера снимают, заказ снова в ленте
    pickup: ${DELIVERY_TIMEOUT_PICKUP:20m}
    # Курьер забрал заказ, но не отдал клиенту — проблема для администратора
    delivering: ${DELIVERY_TIMEOUT_DELIVERING:60m}
  # Уведомления клиенту. Плейсхолдеры: {orderId}, {courierName}, {code}, {reason}
  messages:
    courier-assigned: "Курьер {courierName} взял ваш заказ #{orderId} и скоро заберёт его в заведении."
    picked-up: "Курьер {courierName} везёт ваш заказ #{orderId}. Код для получения: *{code}*. Называйте его только когда заказ у вас в руках."
    delivered: "Заказ #{orderId} доставлен. Приятного аппетита!"
    cancelled: "Доставка заказа #{orderId} отменена: {reason}. Заказ можно забрать в заведении."
    courier-released: "Курьер не успел забрать ваш заказ #{orderId}. Ищем другого курьера."

# Баллы: курьер получает 1 балл за 1 ₸ доставки, а тратит их на заказы с наценкой
wallet:
  # На сколько процентов цена в баллах выше цены в тенге (1000 ₸ = 1200 баллов при 20%)
  points-markup-percent: ${WALLET_POINTS_MARKUP_PERCENT:20}

otp:
  length: 6
  ttl: 5m
  max-attempts: 5
  resend-cooldown: 60s
  storage:
    # true — коды в Redis, а при его недоступности в памяти (Caffeine); false — только Caffeine
    redis-enabled: ${OTP_REDIS_ENABLED:true}
    key-prefix: "dium:otp:"
    circuit-breaker:
      # Из последних 20 обращений к Redis упало >= 50% (и обращений было хотя бы 5) —
      # 30 секунд работаем только с Caffeine, затем 3 пробных запроса решают, вернуться ли на Redis
      failure-rate-threshold: 50
      sliding-window-size: 20
      minimum-number-of-calls: 5
      wait-duration-in-open-state: 30s
      permitted-calls-in-half-open-state: 3

two-factor:
  # Обязательная 2FA для ролей ADMIN и VENUE_OWNER: при входе всегда запрашивается код
  # (WhatsApp по умолчанию, либо TOTP, если пользователь его подключил)
  required-for-staff: ${TWO_FACTOR_REQUIRED_FOR_STAFF:true}
  # Base64 от 32 байт. Дефолт только для dev/test — в prod-профиле переменная обязательна.
  encryption-key: ${TWO_FACTOR_ENCRYPTION_KEY:ZGl1bS1kZXYtb25seS0yZmEta2V5LTAwMDAwMDAwMDE=}
  issuer: DIUM
  pending-token-ttl: 5m
  backup-codes-count: 10
  max-failed-attempts: 5
  lock-duration: 5m

# Лимит на эндпоинты аутентификации: register, login, activate, resend-code,
# forgot-password, reset-password и все /2fa/** — на каждую пару «IP + эндпоинт».
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  capacity: ${RATE_LIMIT_CAPACITY:10}
  period: 1m
  # true — брать IP из X-Forwarded-For (приложение работает за прокси)
  trust-forwarded-header: true

server:
  port: ${PORT:8080}